<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Monitor</title>
<style>
:root{
  --bg:#111214; --panel:#1a1b1e; --panel2:#202125; --line:#2a2c30;
  --text:#e6e6e6; --muted:#8b8d93; --accent:#e0a84b;
  --tick:#e0a84b;   /* tickers: plain amber capitals, used for every ticker on the site */
  --up:43,182,115; --dn:229,83,75; --neu:139,141,147;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 22px 10px}
.brand{font-size:20px;font-weight:700;letter-spacing:-.01em}
.stamp{color:var(--muted);font-size:13px}
nav{display:flex;gap:4px;padding:0 22px;border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:0;background:var(--bg);z-index:5}
nav button{background:none;border:0;color:var(--muted);padding:10px 12px;font:inherit;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav button:hover{color:var(--text)}
nav button.active{color:var(--text);border-bottom-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding:20px 22px 48px;max-width:1500px;margin:0 auto}
section{margin-bottom:30px}
/* section titles: amber tick, spaced caps, hairline to the right edge */
h2{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#fff;margin:0 0 14px;display:flex;align-items:center;gap:12px;border-left:3px solid var(--accent);padding:2px 0 2px 10px;line-height:1.2}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent);margin-left:4px}
h2 small{font-size:12px;font-weight:400;color:var(--muted);letter-spacing:0;text-transform:none}
h3{font-size:14px;font-weight:600;margin:0 0 8px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 13px}
.tile.big{grid-column:span 2;background:var(--panel2)}
.tile .k{color:var(--muted);font-size:12px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:6px}
.tile .v{font-size:20px;font-weight:700;margin:4px 0 2px}
.tile .s{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.tile .r{font-size:12px;margin-top:6px}
/* Market gauges: 8 cards in one row, VIX + curve on top, pair cards below */
.snap{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px}
.snap .tile{display:flex;flex-direction:column;gap:10px;padding:11px 12px}
.snap .tile .k{color:var(--text);font-size:13px}
.snap .tile .kv{color:var(--muted);font-weight:600;font-size:12px}
.snap .tile .v{font-size:26px;margin:0;line-height:1.1}
.snap .tile .s{gap:16px}
.snap .tile .s b:not(.up):not(.dn){color:var(--text)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}
.pair span{display:block;font-size:11px;color:var(--muted);font-weight:600}
.pair b{display:block;font-size:17px;font-weight:700;line-height:1.2}
@media (max-width:1100px){.snap{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:640px){.snap{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pill{padding:1px 7px;border-radius:4px;font-size:11px;font-weight:700;white-space:nowrap}
.up{color:rgb(var(--up))} .dn{color:rgb(var(--dn))} .neu{color:var(--muted)}
.pill.up{background:rgba(var(--up),.18)} .pill.dn{background:rgba(var(--dn),.18)}
.pill.warn{background:rgba(224,168,75,.2);color:var(--accent)}
.pill.neu{background:rgba(var(--neu),.18)}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:4px 11px;border-radius:999px;cursor:pointer;font:inherit;font-size:13px}
.chip.on{color:#1a1a1a;background:var(--accent);border-color:var(--accent);font-weight:600}
input[type=search]{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:6px 10px;border-radius:6px;font:inherit;margin-left:auto;width:200px}
.toolbar:empty{display:none}
/* performance tables: fixed column widths so Sectors, Industries and Market tables line up */
.wrap.perf{width:fit-content;max-width:100%}
.perf table{table-layout:fixed;width:auto}
.perf th:nth-child(1){width:var(--namew,300px)}
.perf th:nth-child(2){width:90px}
.perf th:nth-child(n+3):nth-child(-n+9){width:84px}
.perf th:nth-child(10){width:140px}
.perf th:nth-child(11){width:90px}
.perf th:nth-child(12){width:110px}
.perf td:first-child{overflow:hidden;text-overflow:ellipsis}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
/* column headers: dark band, small spaced caps, amber underline on the sorted column */
th{background:#16171a;color:#9a9ca3;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-align:right;padding:10px 10px 9px;cursor:pointer;user-select:none;white-space:nowrap;border-bottom:1px solid #34363b;box-shadow:inset 0 -2px 0 transparent;transition:color .15s,box-shadow .15s}
th:hover{color:#fff;box-shadow:inset 0 -2px 0 #4a4c52}
th.sorted{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
td{border-radius:0;padding:6px 10px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th.l,td.l{text-align:left}
th.c,td.c{text-align:center}
.num{display:inline-block;text-align:right}
tr.grp th{background:var(--panel);color:var(--text);cursor:default;text-align:center;font-size:15px;font-weight:700;letter-spacing:.02em;padding:9px 10px}
tr.grp th.g0{text-align:left;font-size:12px;font-weight:600;color:var(--muted)}
tr.grp th.g1{background:#e0a84b;color:#1a1206}
tr.grp th.g2{background:#3b6fd4;color:#fff}
.plain th.gs,.plain td.gs{border-left:3px solid rgba(232,237,245,.55)}
.plain td{border-left:1px solid rgba(255,255,255,.05)}
.plain td:first-child{border-left:0}
td.wrapcell{white-space:normal;min-width:220px;max-width:420px}
tbody tr:hover td{box-shadow:inset 0 0 0 999px rgba(255,255,255,.04)}
.sym{font-weight:700}
.tkr{display:inline-block;color:var(--tick);font:700 14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:0 2px;white-space:nowrap;letter-spacing:.04em;text-transform:uppercase}
.tkr:empty{display:none}
.fp-list .tkr,.fp-tks .tkr{font-size:15px}
.nm{color:var(--muted);font-size:12px;margin-left:6px}
.flag{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:6px;vertical-align:middle}
.flag.stale{background:var(--accent)} .flag.missing{background:rgb(var(--dn))}
.rng{position:relative;display:inline-block;width:90px;height:5px;background:var(--line);border-radius:3px;vertical-align:middle}
.rng i{position:absolute;top:-3px;width:3px;height:11px;background:var(--text);border-radius:1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.note{color:var(--muted);font-size:12px;margin-top:6px}
.empty{border:1px dashed var(--line);border-radius:8px;padding:40px;text-align:center;color:var(--muted)}
.tab{display:none} .tab.show{display:block}
.rot{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.rot li{display:flex;align-items:center;gap:10px;padding:7px 12px;border-top:1px solid var(--line)}
.rot li:first-child{border-top:0}
.rot .nm2{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rot .rk{color:var(--muted);font-size:12px;width:70px;text-align:right}
.rot .pc{width:70px;text-align:right;font-weight:700;border-radius:4px;padding:2px 6px}
.rot .placeholder{color:var(--muted);font-style:italic}
/* ---- header controls / connection ---- */
.hdr-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:5px 12px;border-radius:6px;cursor:pointer;font:inherit;font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.settings{margin:0 22px 12px;padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:var(--panel);display:grid;gap:10px;max-width:640px}
.settings label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.settings input{background:var(--bg);border:1px solid var(--line);color:var(--text);padding:7px 10px;border-radius:6px;font:inherit}
[hidden]{display:none !important}
.conn{font-size:12px;color:var(--muted)}
.conn.on{color:rgb(var(--up))}
.status{margin:0 22px 12px;padding:8px 12px;border-radius:6px;background:rgba(224,168,75,.14);color:var(--accent);font-size:13px}
.status.err{background:rgba(var(--dn),.14);color:rgb(var(--dn))}
/* ---- Front Page ---- */
.fp-mast{color:var(--muted);font-size:13px;margin-bottom:14px}
.fp-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px}
.fp-h{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.fp-h.big{font-size:16px;color:#fff;letter-spacing:.1em;background:var(--panel);border:0;border-left:4px solid var(--accent);padding:7px 12px;margin:0 0 4px}
.fp-list{list-style:none;margin:0 0 26px;padding:0}
.fp-list li{display:grid;grid-template-columns:130px 120px minmax(0,1fr);gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.fp-dir{font-size:14px;text-align:center;padding-top:2px}
.fp-tag{font-size:12px;font-weight:700;letter-spacing:.03em;padding-top:3px}
.fp-txt{font:16px/1.55 Charter,"Iowan Old Style",Georgia,serif;color:var(--text)}
.fp-src{font:12px system-ui,sans-serif;color:var(--muted);margin-left:6px;text-decoration:none;white-space:nowrap}
.fp-src:hover{color:var(--accent);text-decoration:underline}
.fp-ticks{display:flex;flex-wrap:wrap;align-content:flex-start;gap:2px 10px;padding-top:2px}
.fp-tks{display:flex;flex-wrap:wrap;gap:2px 10px}
.fp-fig{grid-column:3;display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:4px}
.fp-fig b{color:var(--text);font-weight:600}
.fp-side section{margin-bottom:24px}
.fp-row{display:flex;gap:12px;padding:5px 0;font-size:14px}
.fp-row .t{color:var(--muted);width:72px;flex:none;font-size:13px}
.fp-watch{font:15px/1.5 Charter,"Iowan Old Style",Georgia,serif}
.hot{width:100%;font-size:12.5px}
.hot th{background:none;cursor:default;padding:4px 6px;font-size:11px}
.hot td{padding:4px 6px}
.hot .dot{color:#ff8a00}
.fp-err{border:1px solid rgba(var(--dn),.5);background:rgba(var(--dn),.1);border-radius:8px;padding:16px;margin-bottom:20px}
@media (max-width:980px){.fp-grid{grid-template-columns:1fr}}
@media (max-width:600px){.fp-list li{grid-template-columns:130px 1fr}.fp-list li .fp-txt,.fp-fig{grid-column:1 / -1}}
/* ---- MM drill-down ---- */
td.drill{cursor:pointer}
td.drill:hover{outline:1px solid var(--accent);outline-offset:-1px}
.drill-ov{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;overflow:auto}
.drill-box{background:var(--bg);border:1px solid var(--line);border-radius:10px;width:min(1200px,100%);padding:16px 18px}
.dr-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dr-top h3{margin:0;color:var(--text);font-size:16px}
.dr-lbl{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-top:12px}
.dr-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:6px 0 14px;background:var(--line)}
.dr-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dr-card{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:8px 10px;margin-bottom:8px}
.dr-card h4{margin:0 0 7px;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.dr-card h4 span{color:var(--muted);font-weight:600}
.dr-tools{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 10px}
.dr-col{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.dr-ind{border-bottom:1px solid var(--line)}
.dr-ind:last-child{border-bottom:0}
.dr-ind summary{list-style:none;display:grid;grid-template-columns:16px minmax(0,1fr) 40px 64px;gap:8px;align-items:center;padding:8px 12px;cursor:pointer;font-size:13px}
.dr-ind summary::-webkit-details-marker{display:none}
.dr-ind summary:hover{background:var(--panel2)}
.dr-chev{color:var(--muted);transition:transform .15s;display:inline-block}
.dr-ind[open] .dr-chev{transform:rotate(90deg);color:var(--accent)}
.dr-name{font-weight:700;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr-n{text-align:right;color:var(--muted);font-weight:700}
.dr-avg{text-align:right;font-weight:700}
.dr-list{list-style:none;margin:0;padding:2px 12px 8px 36px;background:#151619}
.dr-list li{display:grid;grid-template-columns:1fr 64px;align-items:center;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:13px}
.dr-list li:last-child{border-bottom:0}
.dr-list li span{text-align:right;font-weight:600}
.dr-list a.tkr{text-decoration:none;justify-self:start}
.dr-list a.tkr:hover{text-decoration:underline}
.tk{display:inline-flex;gap:6px;align-items:center;padding:3px 7px 3px 3px;border-radius:5px;font-size:12px;font-weight:700;text-decoration:none;color:var(--text);background:var(--panel2);border:1px solid var(--line)}
.tk.up i{color:rgb(var(--up))} .tk.dn i{color:rgb(var(--dn))}
.tk:hover{border-color:var(--tick)}
.tk i{font-style:normal;font-weight:600;font-size:11px}
@media (max-width:820px){.dr-cols{grid-template-columns:1fr}}
/* ---- freshness line ---- */
.fresh{font-size:12px;color:var(--muted);margin:0 0 14px}
.fresh b{color:var(--text);font-weight:600}
.fresh.warn,.fresh.warn b{color:var(--accent)}
/* ---- Earnings ---- */
.ern td,.ern th{white-space:nowrap}
.ern .co{color:var(--muted);font-size:12px;margin-left:6px;max-width:220px;display:inline-block;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
.ebtn{background:none;border:1px solid var(--line);color:var(--text);border-radius:6px;width:30px;height:26px;cursor:pointer;font:inherit;font-weight:700}
.ebtn.add:hover{border-color:rgb(var(--up));color:rgb(var(--up))}
.ebtn.on{border-color:rgba(var(--up),.6);color:rgb(var(--up))}
.ebtn.rm:hover,.ebtn.on:hover{border-color:rgb(var(--dn));color:rgb(var(--dn))}
.ebtn:disabled{opacity:.4;cursor:default}
details.eday{margin-bottom:14px}
details.eday>summary{cursor:pointer;font-weight:700;font-size:15px;padding:8px 0;border-bottom:2px solid var(--line);list-style:none}
details.eday>summary::-webkit-details-marker{display:none}
details.eday>summary::before{content:"▸ ";color:var(--muted)}
details.eday[open]>summary::before{content:"▾ "}
details.eday.today>summary{border-bottom-color:var(--accent);color:var(--accent)}
.esess{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 6px 2px;letter-spacing:.04em}
/* ---- ES Forecast ---- */
.es-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:24px}
.es-tiles .tile .v{font-size:28px}
.es-word{color:var(--accent);font-weight:700;font-size:13px;margin-left:6px}
.es-levels{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:28px;align-items:start}
.es-ladder td{padding:6px 10px}
.es-ladder .lv{font-size:17px;font-weight:700}
.es-note{color:var(--muted);font-size:13px;line-height:1.5;margin:10px 0 0}
@media (max-width:820px){.es-levels{grid-template-columns:1fr}}
@media (max-width:820px){.grid2{grid-template-columns:1fr}.tile.big{grid-column:span 1}input[type=search]{margin-left:0;width:100%}}
</style>
</head>
<body>

<header>
  <div class="brand">Market Monitor</div>
  <div class="hdr-r">
    <span class="stamp" id="stamp">Loading data…</span>
    <button class="btn" id="btnRefresh" title="Refresh this page's data">↻ Refresh</button>
    <button class="btn" id="btnSettings" title="Connection settings" aria-label="Connection settings">⚙ <span class="conn" id="connState">Connect</span></button>
  </div>
</header>
<div class="settings" id="settings" hidden>
  <b>Connection</b>
  <div class="note" style="margin:0">Refresh buttons talk to your Apps Script. The access key is stored only in this browser, never on the site.</div>
  <label>Web app address<input id="setUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec"></label>
  <label>Access key<input id="setKey" type="password" autocomplete="off" placeholder="Paste the key from wbCreateKey"></label>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn" id="setSave">Save and test</button>
    <button class="btn" id="setAll">Refresh everything</button>
    <button class="btn" id="setForget">Forget on this device</button>
  </div>
  <div id="setMsg" class="note" style="margin:0"></div>
</div>
<div class="status" id="status" hidden></div>

<nav id="nav">
  <button data-tab="front" class="active">Front Page</button>
  <button data-tab="mm">MM</button>
  <button data-tab="market">Market</button>
  <button data-tab="sectors">Sectors &amp; Industries</button>
  <button data-tab="earnings">Earnings</button>
  <button data-tab="esvol">ES Forecast</button>
</nav>

<main>
  <div class="tab show" id="tab-front"></div>
  <div class="tab" id="tab-market"></div>
  <div class="tab" id="tab-mm"></div>
  <div class="tab" id="tab-earnings"></div>
  <div class="tab" id="tab-sectors"></div>
  <div class="tab" id="tab-esvol"></div>
</main>

<script>
// ================= HELPERS =================
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sign = v => v > 0 ? "+" : "";
const isNum = v => typeof v === "number" && isFinite(v);
const pct = v => { if (!isNum(v)) return "—"; const t = (v * 100).toFixed(1); return (t === "-0.0" ? "0.0" : sign(v) + t) + "%"; };
const bps = v => isNum(v) ? sign(v) + Math.round(v) + " bp" : "—";
function heat(v, scale){
  if (!isNum(v) || !scale) return "";
  const a = (Math.min(Math.abs(v) / scale, 1) * 0.6 + 0.05).toFixed(2);
  return `background:rgba(var(${v >= 0 ? "--up" : "--dn"}),${a})`;
}
const toneCls = t => t === "good" ? "up" : t === "bad" ? "dn" : "neu";

// Generic sortable table. cols: {key,label,cls,render(r),heat(r),sort(r)}
function buildTable(host, colsIn, getRows, init){
  const st = Object.assign({key:null, dir:-1}, init || {});
  function draw(){
    const cols = typeof colsIn === "function" ? colsIn() : colsIn;   // cols may depend on the rows shown
    let rows = getRows().slice();
    if (st.key){
      const c = cols.find(c => c.key === st.key), sv = c.sort || (r => r[c.key]);
      rows.sort((a, b) => { const x = sv(a), y = sv(b);
        const nx = x == null || x === "", ny = y == null || y === "";
        if (nx && ny) return 0; if (nx) return 1; if (ny) return -1;
        return (typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y))) * st.dir; });
    }
    host.innerHTML = `<table><thead>${st.groupRow || ""}<tr>${cols.map(c =>
      `<th class="${c.cls || ""} ${c.gs ? "gs" : ""} ${st.key === c.key ? "sorted" : ""}" data-k="${esc(c.key)}">${esc(c.label)}${st.key === c.key ? (st.dir > 0 ? " ▲" : " ▼") : ""}</th>`).join("")}</tr></thead>
      <tbody>${rows.map(r => `<tr>${cols.map(c =>
      `<td ${c.attrs ? c.attrs(r) : ""} class="${(c.tdcls ? c.tdcls(r) : (c.cls || "")) + (c.gs ? " gs" : "")}" style="${c.heat ? c.heat(r) : c.style ? c.style(r) : ""}">${c.render ? c.render(r) : esc(r[c.key])}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    host.querySelectorAll("th[data-k]").forEach(th => th.onclick = () => {
      const k = th.dataset.k;
      if (st.key === k){ if (st.dir === -1) st.dir = 1; else st.key = null; }
      else { st.key = k; st.dir = -1; }
      draw();
    });
  }
  draw();
  return draw;
}

// ---- Sheet colours -> dark-theme colours ----
// The Sheet's palette is built for a white page. Each fill is classified by hue
// (green / red / amber / blue) and strength: pale fills = normal readings,
// darker or fully saturated fills = extreme readings. Neon green is kept as-is.
function hsl(hex){
  const n = parseInt(hex.slice(1), 16), r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  if (!d) return {h: 0, s: 0, l};
  const s = d / (1 - Math.abs(2 * l - 1));
  let h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  h = (h * 60 + 360) % 360;
  return {h, s, l};
}
function sheetTone(hex){
  if (!hex) return null;
  const c = hsl(hex);
  if (c.s < 0.15 || c.l > 0.97) return null;                       // grey / white: neutral
  const strong = c.l <= 0.65;
  if (c.h >= 75 && c.h <= 165) return {k: (c.s >= 0.9 && c.l <= 0.6) ? "neon" : "up", strong};
  if (c.h < 20 || c.h >= 330) return {k: "dn", strong};
  if (c.h < 70) return {k: "warn", strong};
  if (c.h >= 180 && c.h < 260) return {k: "info", strong};
  return null;
}
const TINT = {up: "46,190,120", dn: "235,87,78", warn: "224,168,75", info: "90,145,230"};
function sheetStyle(bg, fg){
  const t = sheetTone(bg);
  if (t){
    if (t.k === "neon") return `background:${bg};color:#06210f;font-weight:700`;
    return t.strong ? `background:rgba(${TINT[t.k]},.85);color:#fff;font-weight:700`
                    : `background:rgba(${TINT[t.k]},.38)`;
  }
  const f = sheetTone(fg);                                          // coloured text only
  if (f && TINT[f.k]) return `color:rgb(${TINT[f.k]})` + (f.strong ? ";font-weight:700" : "");
  return "";
}

// Plain copy of a Sheet tab: values (for sorting), display (as shown in the Sheet),
// colours (as shown in the Sheet, conditional formatting included)
function renderPlainTab(host, title, tab, opts){
  opts = opts || {};
  if (!tab){ host.insertAdjacentHTML("beforeend", `<section><h2>${esc(title)}</h2><div class="empty">No data for this tab yet.</div></section>`); return; }
  const id = "t" + Math.random().toString(36).slice(2, 8);
  const keep = tab.headers.map((h, i) => String(h).trim() || tab.display.some(r => String(r[i]).trim()) ? i : -1).filter(i => i >= 0);
  const numeric = {};
  keep.forEach(i => { const vals = tab.values.map(r => r[i]).filter(v => v !== "" && v != null);
    numeric[i] = vals.length && vals.filter(isNum).length / vals.length > 0.8; });
  const col = tab.colors || null;
  let rows = tab.values.map((v, k) => ({ v, d: tab.display[k], bg: col ? col.bg[k] || [] : [], fg: col ? col.fg[k] || [] : [] }));
  if (opts.limit) rows = rows.slice(0, opts.limit);
  const dateCol = tab.headers.findIndex(h => String(h).trim().toLowerCase() === "date");
  // Numbers sit in the centre of their column but stay right-aligned to each
  // other: each value goes in a box as wide as the longest value in that column.
  const cols = keep.map(i => {
    const custom = opts.colStyle ? opts.colStyle(String(tab.headers[i]).trim().toLowerCase(), i, rows) : null;
    const w = numeric[i] ? Math.max(1, ...rows.map(r => String(r.d[i]).length)) : 0;
    const hdr = String(tab.headers[i]).trim();
    const drill = opts.drill && DRILL_PAIR[hdr] && dateCol >= 0;
    return {
      key: String(i), label: hdr, cls: numeric[i] ? "c" : "l",
      attrs: drill ? r => `data-d="${esc(r.v[dateCol])}" data-m="${esc(hdr)}" title="Show the stocks"` : null,
      tdcls: r => (numeric[i] ? "c" : (String(r.d[i]).length > 60 ? "l wrapcell" : "l")) + (drill ? " drill" : ""),
      style: custom && custom.style ? custom.style : r => sheetStyle(r.bg[i], r.fg[i]),
      render: custom && custom.render ? custom.render
        : numeric[i] ? r => `<span class="num" style="min-width:${w}ch">${esc(r.d[i])}</span>` : r => esc(r.d[i]),
      sort: r => r.v[i]
    };
  });

  // group-label row: each label spans until the next label. The first group
  // (the "Updated" stamp) stays plain; the sections after it alternate colours
  // and get a divider line down the table at their first column.
  let groupRow = "";
  if (tab.groups && tab.groups.some(g => String(g).trim())){
    const cells = [];
    keep.forEach((i, n) => {
      const g = String(tab.groups[i] || "").trim();
      if (g || !cells.length){ cells.push({label: g, span: 1}); if (n > 0) cols[n].gs = true; }
      else cells[cells.length - 1].span++;
    });
    groupRow = `<tr class="grp">${cells.map((c, j) =>
      `<th colspan="${c.span}" class="${j === 0 ? "g0" : (j % 2 ? "g1" : "g2")}${j > 0 ? " gs" : ""}">${j === 0 && /^updated/i.test(c.label) ? "" : esc(c.label)}</th>`).join("")}</tr>`;
  }

  const more = tab.total > tab.values.length ? ` · showing ${tab.values.length} of ${tab.total}` : "";
  const count = opts.limit ? `top ${rows.length} of ${tab.total}` : `${tab.values.length} rows${more}`;
  host.insertAdjacentHTML("beforeend", `<section>${opts.hideTitle ? "" : `<h2>${esc(title)} <small>${count}</small></h2>`}
    ${opts.noSearch ? "" : `<div class="toolbar"><input type="search" id="${id}q" placeholder="Search ${esc(title)}"></div>`}
    <div class="wrap plain" id="${id}"></div></section>`);
  let q = "";
  const draw = buildTable($(id), cols, () => rows.filter(r => !q || r.d.join(" ").toLowerCase().includes(q)), {groupRow});
  if (!opts.noSearch) $(id + "q").oninput = e => { q = e.target.value.trim().toLowerCase(); draw(); };
  if (opts.drill) $(id).addEventListener("click", e => {
    const td = e.target.closest("td.drill"); if (td) openDrill(td.dataset.d, td.dataset.m);
  });
}

// ================= MARKET DASHBOARD =================
const PCT_SCALE = {d1:.02, w1:.03, m1:.06, m3:.10, m6:.15, y1:.25, ytd:.20};
const PERIODS = [["d1","1D"],["w1","1W"],["m1","1M"],["m3","3M"],["m6","6M"],["y1","1Y"],["ytd","YTD"]];

function fmtLast(r){
  if (!isNum(r.last)) return "—";
  if (r.yield) return r.last.toFixed(2) + "%";
  return r.last >= 1000 ? r.last.toLocaleString("en-US", {maximumFractionDigits:0}) : r.last.toFixed(2);
}
function scaleFor(r, key){
  if (r.yield) return 25;            // bp
  if (r.sym === "^VIX") return 0.20; // fixed, like the Sheet
  return PCT_SCALE[key];
}

// One performance block: table chips, optional group chips + search, sortable heat table
function perfSection(host, uid, title, tables, note, noGroup){
  host.insertAdjacentHTML("beforeend", `<section><h2>${esc(title)}</h2>
    <div class="toolbar" id="${uid}T"></div><div class="toolbar" id="${uid}G"></div>
    <div class="wrap perf" id="${uid}P"></div>${note ? `<div class="note">${note}</div>` : ""}</section>`);
  let tIdx = 0, group = "All";
  const nameCol = {key:"name", label:"Name", cls:"l", sort: r => r.name,
    render: r => `<span class="sym">${esc(r.name)}</span> <span class="tkr" style="margin-left:4px">${esc(r.sym)}</span>${r.status !== "ok" ? `<span class="flag ${r.status}" title="${r.status} data"></span>` : ""}`};
  const cols = [nameCol, {key:"last", label:"Last", render: fmtLast}]
    .concat(PERIODS.map(([k, lbl]) => ({key:k, label:lbl,
      render: r => r.yield ? bps(r[k]) : pct(r[k]), heat: r => heat(r[k], scaleFor(r, k))})))
    .concat([
      {key:"rng", label:"52W range", sort: r => isNum(r.hi) && r.hi !== r.lo ? (r.last - r.lo) / (r.hi - r.lo) : null,
        render: r => isNum(r.hi) && isNum(r.lo) && r.hi !== r.lo
          ? `<span class="rng" title="Low ${r.lo} · High ${r.hi}"><i style="left:${Math.max(0, Math.min(97, (r.last - r.lo) / (r.hi - r.lo) * 100))}%"></i></span>` : "—"},
      {key:"off", label:"Off high", sort: r => r.yield || !isNum(r.hi) ? null : r.last / r.hi - 1,
        render: r => r.yield || !isNum(r.hi) ? "—" : pct(r.last / r.hi - 1)},
      {key:"group", label:"Group", cls:"l"}
    ]);
  // a table whose rows all share one group (Sectors) gets no Group column
  const allCols = cols, oneGroup = () => new Set(tables[tIdx].rows.map(r => r.group)).size < 2;
  const blankGroup = {key:"group", label:"", cls:"l", render: () => "", sort: () => null};
  const colsNow = () => noGroup || oneGroup() ? allCols.map(c => c.key === "group" ? blankGroup : c) : allCols;
  // default order: biggest 1D gain first (the fixed Volatility & rates table keeps its own order)
  const byD1 = (a, b) => (isNum(b.d1) ? b.d1 : -Infinity) - (isNum(a.d1) ? a.d1 : -Infinity);
  const rowsNow = () => { const t = tables[tIdx], rows = t.rows.filter(r => group === "All" || r.group === group);
    return /VOLATILITY/i.test(t.title) ? rows : rows.slice().sort(byD1); };
  const draw = buildTable($(uid + "P"), colsNow, rowsNow);
  function drawGroups(){
    const groups = ["All", ...new Set(tables[tIdx].rows.map(r => r.group))];
    $(uid + "G").innerHTML = (groups.length > 2 ? groups.map(g => `<button class="chip ${g === group ? "on" : ""}">${esc(g)}</button>`).join("") : "")
;
    $(uid + "G").querySelectorAll(".chip").forEach(b => b.onclick = () => { group = b.textContent; drawGroups(); draw(); });
  }
  $(uid + "T").innerHTML = tables.length > 1 ? tables.map((t, i) => `<button class="chip ${i === 0 ? "on" : ""}" data-i="${i}">${esc(t.title.charAt(0) + t.title.slice(1).toLowerCase())}</button>`).join("") : "";
  $(uid + "T").querySelectorAll(".chip").forEach(b => b.onclick = () => {
    tIdx = +b.dataset.i; group = "All";
    $(uid + "T").querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === b));
    drawGroups(); draw();
  });
  drawGroups();
}
const FLAGS_NOTE = 'Sorted by 1D by default. Click a column header to sort; click again to reverse, a third time to go back to 1D. Rates show changes in basis points. <span class="flag stale"></span> stale data · <span class="flag missing"></span> missing data.';
const byTitle = (m, re) => m.tables.filter(t => re.test(t.title));

function renderMarket(m){
  const host = $("tab-market");
  if (!m){ host.innerHTML = '<div class="empty">No Market data in the latest export.</div>'; return; }
  const all = {}; m.tables.forEach(t => t.rows.forEach(r => all[r.sym] = r));

  host.innerHTML = `<section><h2>Market gauges${/stale|missing/i.test(m.status || "") ? ` <small style="color:var(--accent)">${esc("Stale data: " + String(m.status).replace(/^Data as of:[^·]*·?\s*/i, "").replace(/^\d+\s+STALE:\s*/i, ""))}</small>` : ""}</h2><div class="snap" id="mTiles"></div></section>`;

  // ---- gauge cards: one row, fixed order, every card = title + 1M / 3M ----
  const rel = {}; m.relative.rows.forEach(r => rel[r.label] = r);
  const ri = m.relative.periods.indexOf("1M"), ri3 = m.relative.periods.indexOf("3M");
  const fromRel = (label, flip) => { const r = rel[label]; if (!r) return null; const k = flip ? -1 : 1; return [r.vals[ri] * k, r.vals[ri3] * k]; };
  const fromSyms = (a, b) => { const x = all[a], y = all[b]; return x && y && isNum(x.m1) && isNum(y.m1) ? [x.m1 - y.m1, x.m3 - y.m3] : null; };
  const vix = all["^VIX"], y2 = Object.values(all).find(r => r.name === "US 2Y"), y10 = Object.values(all).find(r => r.name === "US 10Y");
  const card = (title, sub, v, fmt, cls) => v ? `<div class="tile"><div class="k"><span>${title}</span>${sub ? `<span class="kv">${sub}</span>` : ""}</div>
      <div class="pair"><div><span>1M</span><b class="${cls(v[0])}">${fmt(v[0])}</b></div><div><span>3M</span><b class="${cls(v[1])}">${fmt(v[1])}</b></div></div></div>` : "";
  const ud = v => v >= 0 ? "up" : "dn";
  let tiles = [
    ["SPY vs RSP",  fromRel("RSP vs SPY", true)],
    ["QQQ vs QQQE", fromRel("QQQE vs QQQ", true)],
    ["MAGS vs QQQE", fromSyms("MAGS", "QQQE")],
    ["SPY vs IWM",  fromRel("IWM vs SPY", true)],
    ["QQQ vs DIA",  fromRel("QQQ vs DIA")],
    ["USD vs Gold", fromRel("USD vs Gold")]
  ].map(([t, v]) => card(t, "", v, pct, ud)).join("");
  if (vix && isNum(vix.last)) tiles += card("VIX", vix.last.toFixed(2), [vix.m1, vix.m3], pct, v => v > 0 ? "dn" : "up");
  if (y2 && y10 && isNum(y2.last) && isNum(y10.last)){
    const sp = Math.round((y10.last - y2.last) * 100);
    tiles += card("2Y–10Y", `${sign(sp)}${sp} bp`, [y10.m1 - y2.m1, y10.m3 - y2.m3], v => `${sign(v)}${Math.round(v)} bp`, ud);
  }
  $("mTiles").innerHTML = tiles;

  // ---- performance: macro assets and volatility & rates ----
  perfSection(host, "mk", "Performance", byTitle(m, /MACRO|VOLATILITY/), FLAGS_NOTE, true);

  // ---- relative performance ----
  host.insertAdjacentHTML("beforeend", `<section><h2>Relative performance <small>A minus B return</small></h2><div class="wrap" id="mRel"></div></section>`);
  const relCols = [{key:"label", label:"Pair", cls:"l", render: r => `<span class="sym">${esc(r.label)}</span>`}]
    .concat(m.relative.periods.map((p, i) => ({key:"p" + i, label:p, sort: r => r.vals[i],
      render: r => pct(r.vals[i]), heat: r => heat(r.vals[i], m.relative.scale[i])})))
;
  buildTable($("mRel"), relCols, () => m.relative.rows);
}

// Name column width: the longest "Name TICKER" across every performance table, plus a little room
function setNameWidth(m){
  const box = document.createElement("div");

const surpCls = v => /^\s*[-−]/.test(String(v || "")) ? "dn" : "up";

// Top N of a social tab, by column name
function hotRows(tab, n){

  return tab.values.slice(0, n).map((v, k) => {
    const d = tab.display[k], get = name => at(name) >= 0 ? d[at(name)] : "", val = name => at(name) >= 0 ? v[at(name)] : null;
    return {rank: get("rank") || String(k + 1), ticker: String(get("ticker")).toUpperCase(), ment: get("mentions"),
      bull: get("bullish %"), bear: get("bearish %"), trend: String(get("trend")).toLowerCase(),

// The last completed session, taken from the Market tab's "Data as of" badge.
// Used as the reference: a page whose data is older than this is a session behind.
function refSession(d){
  const m = String((d.market && d.market.status) || "").match(/(\d{1,2})-([A-Za-z]{3})-(\d{4})/);
  if (!m) return "";
  const mon = {jan:"01",feb:"02",mar:"03",apr:"04",may:"05",jun:"06",jul:"07",aug:"08",sep:"09",oct:"10",nov:"11",dec:"12"}[m[2].toLowerCase()];
  return mon ? `${m[3]}-${mon}-${m[1].padStart(2, "0")}` : "";
}
const fresh = (html, warn) => `<div class="fresh${warn ? " warn" : ""}">${html}</div>`;

// ================= MM DRILL-DOWN =================
// Each clickable column opens its pair: up side left, down side right.
const DRILL_PAIR = {
  "Up 4%": ["Up 4%", "Down 4%"], "Down 4%": ["Up 4%", "Down 4%"], "Participation": ["Up 4%", "Down 4%"],
  "W20% Up": ["W20% Up", "W20% Down"], "W20% Down": ["W20% Up", "W20% Down"],
  "Q25% Up": ["Q25% Up", "Q25% Down"], "Q25% Down": ["Q25% Up", "Q25% Down"],
  "NH21": ["NH21", "NL52W"], "NL52W": ["NH21", "NL52W"]
};
const DRILL_MOVE = {"Up 4%": "1-day", "Down 4%": "1-day", "W20% Up": "5-day", "W20% Down": "5-day",
  "Q25% Up": "63-day", "Q25% Down": "63-day", "NH21": "1-day", "NL52W": "1-day"};
const DRILL_NAME = {"NH21": "21-day new highs", "NL52W": "52-week new lows"};
const drillCache = {};

function drillSide(d, name, up){
  const items = (d.metrics[name] || []).map(([t, i, c]) => ({t, ind: d.industries[i] || "Ungrouped", c}));
  const groups = {};
  items.forEach(x => (groups[x.ind] = groups[x.ind] || []).push(x));
  const pc = v => `${sign(v)}${v.toFixed(1)}%`;
  const rows = Object.keys(groups)
    .sort((a, b) => groups[b].length - groups[a].length || a.localeCompare(b))
    .map(g => {
      const list = groups[g].sort((a, b) => b.c - a.c);              // descending % change
      const avg = list.reduce((s, x) => s + x.c, 0) / list.length;
      return `<details class="dr-ind"><summary><span class="dr-chev">▸</span><span class="dr-name">${esc(g)}</span>
          <span class="dr-n">${list.length}</span><span class="dr-avg ${avg >= 0 ? "up" : "dn"}" title="Average move">${pc(avg)}</span></summary>
        <ul class="dr-list">${list.map(x => `<li><a href="https://www.tradingview.com/chart/?symbol=${encodeURIComponent(x.t)}" target="_blank" rel="noopener" class="tkr">${esc(x.t)}</a>
          <span class="${x.c >= 0 ? "up" : "dn"}">${pc(x.c)}</span></li>`).join("")}</ul></details>`;
    }).join("");
  return {n: items.length, html: rows ? `<div class="dr-col">${rows}</div>` : '<div class="note">No stocks.</div>'};
}

function closeDrill(){ const o = $("drillOv"); if (o) o.remove(); }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrill(); });

async function openDrill(date, metric){
  closeDrill();
  const [a, b] = DRILL_PAIR[metric];
  const day = new Date(date + "T12:00:00").toLocaleDateString("en-GB", {weekday: "short", day: "numeric", month: "short", year: "numeric"});
  document.body.insertAdjacentHTML("beforeend", `<div class="drill-ov" id="drillOv"><div class="drill-box" role="dialog" aria-modal="true">
    <div class="dr-top"><h3>${esc(DRILL_NAME[a] || a)} vs ${esc(DRILL_NAME[b] || b)} · ${esc(day)}</h3>
    <button class="btn" id="drillX" aria-label="Close">✕</button></div><div id="drillBody" class="note">Loading…</div></div></div>`);
  $("drillX").onclick = closeDrill;
  $("drillOv").onclick = e => { if (e.target.id === "drillOv") closeDrill(); };
  try {
    const d = drillCache[date] || (drillCache[date] = await fetch(`mm/${date}.json?v=${Date.now()}`, {cache: "no-store"})
      .then(r => { if (!r.ok) throw new Error("no drill-down saved for this date"); return r.json(); }));
    const L = drillSide(d, a, true), R = drillSide(d, b, false), tot = L.n + R.n || 1;
    $("drillBody").className = "";
    $("drillBody").innerHTML = `
      <div class="dr-lbl"><span class="up">${esc(a)} ${Math.round(L.n / tot * 100)}% (${L.n})</span><span class="dn">${esc(b)} ${Math.round(R.n / tot * 100)}% (${R.n})</span></div>
      <div class="dr-bar"><div style="width:${L.n / tot * 100}%;background:rgb(var(--up))"></div><div style="flex:1;background:rgb(var(--dn))"></div></div>
      <div class="dr-tools"><span class="note" style="margin:0">Industries by number of stocks · ${DRILL_MOVE[a]} move · click an industry to show its stocks, a ticker to open its chart</span><button class="btn" id="drillAll">Expand all</button></div>
      <div class="dr-cols"><div>${L.html}</div><div>${R.html}</div></div>`;
    $("drillAll").onclick = () => {
      const all = [...document.querySelectorAll("#drillBody details")], open = all.some(x => !x.open);
      all.forEach(x => x.open = open);
      $("drillAll").textContent = open ? "Collapse all" : "Expand all";
    };
  } catch (e) {
    $("drillBody").textContent = "Could not load the stocks: " + e.message + ".";
  }
}

function renderES(es){
  const host = $("tab-esvol");
  if (!es){ host.innerHTML = '<div class="empty">No ES Forecast in the latest export yet.<br>In the Sheet run <b>Market Dashboard → ES Forecast refresh</b>, then <b>Market Dashboard → Dashboard publish</b>.</div>'; return; }
  const L = es.levels, R = es.range, f0 = v => isNum(v) ? v.toLocaleString("en-US", {maximumFractionDigits: 0}) : esc(v);
  const f2 = v => isNum(v) ? v.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2}) : esc(v);
  const COL = {Typical: "#7aa6e8", Busy: "#4cc3bb", Outlier: "#b393e6"};

  // candles: one bar per scenario, drawn to scale around the prior close
  const out = L.rows.find(r => r.name === "Outlier") || L.rows[L.rows.length - 1];
  const top = out.high, bot = out.low, H = 300, pad = 14, y = v => pad + (top - v) / (top - bot || 1) * (H - 2 * pad);
  const bars = L.rows.map((r, i) => {
    const x = 70 + i * 70;
    return `<rect x="${x}" y="${y(r.high)}" width="34" height="${y(r.low) - y(r.high)}" rx="3" fill="${COL[r.name]}" opacity="${0.95 - i * 0.2}"/>
      <text x="${x + 17}" y="${H + 16}" text-anchor="middle" fill="${COL[r.name]}" font-size="12" font-weight="700">${r.name}</text>
      <text x="${x + 17}" y="${H + 32}" text-anchor="middle" fill="#8b8d93" font-size="11">${r.pts} pts</text>`;
  }).join("");
  const svg = `<svg viewBox="0 0 290 ${H + 40}" width="100%" style="max-width:300px">
    ${bars}<line x1="56" x2="290" y1="${y(L.anchor)}" y2="${y(L.anchor)}" stroke="#e6e6e6" stroke-width="2"/>
    <text x="52" y="${y(L.anchor) + 4}" text-anchor="end" fill="#e6e6e6" font-size="11" font-weight="700">${f0(L.anchor)}</text></svg>`;

  const lvl = (r, side) => { const v = side === "hi" ? r.high : r.low;
    return `<tr><td class="l" style="color:${COL[r.name]}">${r.name}</td><td class="lv">${f0(v)}</td><td>${Math.round(r.prob * 100)}%</td><td class="neu">${sign(v - L.anchor)}${f0(v - L.anchor)}</td></tr>`; };
  const ladder = `<table class="es-ladder"><thead><tr><th class="l">Highs</th><th>Level</th><th>Chance</th><th>vs close</th></tr></thead><tbody>
      ${L.rows.slice().reverse().map(r => lvl(r, "hi")).join("")}
      <tr><td class="l"><b>Anchor</b></td><td class="lv">${f2(L.anchor)}</td><td colspan="2" class="${L.skew === "Balanced" ? "neu" : ""}" style="${L.skew === "Balanced" ? "" : "color:var(--accent)"}">${Math.round(L.up * 100)}/${Math.round(L.down * 100)} split</td></tr>
      <tr><th class="l">Lows</th><th></th><th></th><th></th></tr>
      ${L.rows.map(r => lvl(r, "lo")).join("")}</tbody></table>`;

  const simple = (headers, rows, boldRows) => `<div class="wrap"><table><thead><tr>${headers.map((h, i) => `<th class="${i ? "" : "l"}">${h}</th>`).join("")}</tr></thead><tbody>${
    rows.map((r, k) => `<tr>${r.map((c, i) => `<td class="${i ? (i === r.length - 1 ? "neu" : "") : "l"}" style="${(boldRows || []).includes(k) ? "font-weight:700" : ""}">${isNum(c) ? f2(c).replace(/\.00$/, "") : esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;

  host.innerHTML = `
    <section><h2>ES forecast <small>ES ${f2(es.close)} · ${esc(es.regime)}</small></h2>
      <div class="es-tiles">
        <div class="tile"><div class="k">Potential range</div><div class="v">${R.typical}<span class="es-word">pts · ${esc(R.word)}</span></div><div class="s">${R.quiet} quiet — ${R.busy} busy</div></div>
        <div class="tile"><div class="k">Day type</div><div class="v" style="font-size:22px">${esc(es.dayType)}<span class="es-word">${esc(es.dayWord)}</span></div><div class="s">${Math.round((1 - es.trendRate) * 100)}% range · ${Math.round(es.trendRate * 100)}% trend</div></div>
        <div class="tile"><div class="k">Trend days · ${esc(es.regime)}</div><div class="v">${Math.round(es.trendRate * 100)}%</div><div class="s">all regimes ${Math.round(es.trendRateAll * 100)}%</div></div>
        <div class="tile"><div class="k">Anchor · prior close</div><div class="v">${f2(L.anchor)}</div><div class="s">last session ran ${f2(R.lastRange)} pts</div></div>
      </div></section>
    <section><h2>Key levels <small>${esc(L.trendState)} · ${esc(L.skew)}</small></h2>
      <div class="es-levels"><div>${svg}</div><div>${ladder}
        <p class="es-note">${L.usingState ? `The range is split ${Math.round(L.up * 100)}/${Math.round(L.down * 100)} using the ${L.stateCount.toLocaleString()} past sessions in the same trend state (all sessions: ${Math.round(L.upAll * 100)}/${100 - Math.round(L.upAll * 100)}).` : "Too few past sessions in this trend state, so the all-sessions split is used."}
        ES trades above the prior close in ${Math.round(L.touchAbove * 100)}% of sessions and below it in ${Math.round(L.touchBelow * 100)}%, so both sides are usually touched; the question is how far. Typical miss ±${Math.round(es.miss * 100)}% around the typical figure.</p></div></div></section>
    <section><h2>Session forecast</h2>${simple(["Measure", "Model", "Regime", "Chance", "Note"], es.forecast, [1])}</section>
    <section><h2>Market environment</h2>${simple(["Measure", "Value", "Context", "Note"], es.environment, [0, 2, 5])}
      <p class="es-note">${esc(es.footnote)}</p></section>`;
}

// Bullish % = green, stronger the higher it is. Bearish % = red, likewise.
// Any other % / change column = green when positive, red when negative,
// scaled to the biggest move in the list. Trend = coloured arrow.
function socialCol(h, i, rows){
  const vals = rows.map(r => r.v[i]).filter(isNum);
  const max = vals.length ? Math.max(...vals.map(Math.abs)) : 0;
  const unit = max > 1.5 ? 100 : 1;                       // 0-100 or 0-1 values
  const level = (rgb, x) => { x = Math.max(0, Math.min(1, x));
    return `background:rgba(${rgb},${(0.12 + 0.73 * x).toFixed(2)})` + (x >= 0.6 ? ";color:#fff;font-weight:700" : ""); };
  if (/bull/.test(h)) return {style: r => isNum(r.v[i]) ? level(TINT.up, r.v[i] / unit) : ""};
  if (/bear/.test(h)) return {style: r => isNum(r.v[i]) ? level(TINT.dn, r.v[i] / unit) : ""};
  if (/trend/.test(h)) return {
    style: () => "font-weight:700",
    render: r => { const t = String(r.d[i]).trim().toLowerCase();
      return t === "rising" ? '<span class="up">▲ Rising</span>' : t === "falling" ? '<span class="dn">▼ Falling</span>'
        : `<span class="neu">${esc(r.d[i]) || "–"}</span>`; }
  };
  if (/%|chg|change/.test(h) && max) return {style: r => isNum(r.v[i]) && r.v[i] !== 0
    ? level(r.v[i] > 0 ? TINT.up : TINT.dn, Math.abs(r.v[i]) / max) : ""};
  return null;
}

let DATA = null;
const LS = {

function status(msg, err){

async function api(body){
  const url = apiUrl(), key = LS.get("mmKey");
  if (!url || !key) throw new Error("Not connected on this device: open ⚙ and enter your access key.");
  const r = await fetch(url, {method: "POST", body: JSON.stringify(Object.assign({key}, body))});

  return r.json();

// After a refresh is queued, check data.json every 30 s and reload once it is newer.
function watchFor(since, label){
  sessionStorage.setItem("mmPending", JSON.stringify({since, label}));
  const t0 = Date.now();
  const timer = setInterval(async () => {
    try {
      const d = await (await fetch("data.json?v=" + Date.now(), {cache: "no-store"})).json();
      if (new Date(d.updated) > new Date(since)){ clearInterval(timer); sessionStorage.removeItem("mmPending"); location.reload(); }
    } catch (e) {}
    if (Date.now() - t0 > 25 * 60000){
      clearInterval(timer); sessionStorage.removeItem("mmPending");
      status(label + ": no new data after 25 minutes. Check Market Dashboard → Schedule and last runs in the Sheet.", true);
    }
  }, 30000);
}
async function startRefresh(what, label){
  $("btnRefresh").disabled = true;
  try {
    const res = await api({action: "refresh", what});
    if (!res.ok) throw new Error(res.error || "Refresh failed");
    status(`${res.message}. New data in about ${res.eta} min; this page reloads by itself.`);
    watchFor(res.requested, label);
  } catch (e) {
    status(e.message, true);
    $("btnRefresh").disabled = false;
    if (!LS.get("mmKey")) openSettings();
  }
}
$("btnRefresh").onclick = () => {
  const t = currentTab(), names = {front: "Front Page", mm: "MM", market: "Market", sectors: "Sectors & Industries", esvol: "ES Forecast", earnings: "Earnings"};
  startRefresh(TAB_WHAT[t], names[t]);
};

// header label: shows whether this browser holds a key
function showConn(){
  const on = !!LS.get("mmKey");
  $("connState").textContent = on ? "● Connected" : "Connect";
  $("connState").classList.toggle("on", on);
}
showConn();

function openSettings(){
  $("settings").hidden = false;
  $("setUrl").value = LS.get("mmUrl") || (DATA && DATA.webApp) || "";
  $("setKey").value = LS.get("mmKey");
}
$("btnSettings").onclick = () => $("settings").hidden ? openSettings() : ($("settings").hidden = true);
$("setSave").onclick = async () => {
  const url = $("setUrl").value.trim();
  LS.set("mmUrl", url && url !== (DATA && DATA.webApp) ? url : "");
  LS.set("mmKey", $("setKey").value.trim());
  $("setMsg").textContent = "Testing…";
  try {
    const r = await api({action: "ping"});
    $("setMsg").textContent = r.ok ? "Connected. Refresh buttons are ready on this device." : (r.error || "Not connected");
    if (!r.ok) LS.set("mmKey", "");
    if (r.ok) setTimeout(() => { $("settings").hidden = true; $("setMsg").textContent = ""; }, 1200);
  } catch (e) { $("setMsg").textContent = e.message; }
  showConn();
};
$("setAll").onclick = () => { $("settings").hidden = true; startRefresh("all", "Full update"); };
$("setForget").onclick = () => { LS.set("mmKey", ""); LS.set("mmUrl", ""); $("setKey").value = ""; $("setMsg").textContent = "Key removed from this device."; showConn(); };

// resume watching if the page was reloaded mid-refresh
try {
  const p = JSON.parse(sessionStorage.getItem("mmPending") || "null");
  if (p){ status(p.label + " refresh in progress; this page reloads when new data arrives."); $("btnRefresh").disabled = true; watchFor(p.since, p.label); }
} catch (e) {}

// ================= LOAD =================
fetch("data.json?v=" + Date.now(), {cache: "no-store"})
  .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(d => {
    DATA = d;
    $("stamp").textContent = "Data published " + d.updatedText;
    try { renderFront(d); } catch (e) { $("tab-front").innerHTML = `<div class="empty">Front Page could not be drawn: ${esc(e.message)}</div>`; }
    try { if (d.market) setNameWidth(d.market); } catch (e) {}
    try { renderSectors(d.market); } catch (e) { $("tab-sectors").innerHTML = `<div class="empty">Sectors could not be drawn: ${esc(e.message)}</div>`; }
    try { renderES(d.esForecast); } catch (e) { $("tab-esvol").innerHTML = `<div class="empty">ES Forecast could not be drawn: ${esc(e.message)}</div>`; }
    try { renderMarket(d.market); } catch (e) { $("tab-market").innerHTML = `<div class="empty">Market section could not be drawn: ${esc(e.message)}</div>`; }
    try { renderPlainTabs(d); } catch (e) { console.error(e); }
    try { renderEarnings(d); } catch (e) { $("tab-earnings").innerHTML = `<div class="empty">Earnings could not be drawn: ${esc(e.message)}</div>`; }
  })
  .catch(e => {
    $("stamp").textContent = "No data loaded";
    $("tab-front").innerHTML = `<div class="empty">No dashboard data yet (${esc(e.message)}).<br>In the Sheet, run <b>Market Dashboard → Dashboard publish</b>, wait a minute, then reload this page.</div>`;
  });
</script>
</body>
</html>
